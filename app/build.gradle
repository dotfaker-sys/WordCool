plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.wordcool.app'
    compileSdk 34

    defaultConfig {
        applicationId 'com.wordcool.app'
        minSdk 26
        targetSdk 34
        versionCode 2
        versionName '1.1'
    }

    buildTypes {
        debug {
            minifyEnabled false
        }
        release {
            minifyEnabled false
            // 直接使用 debug 签名，产出的 release 包也能立刻安装
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
}

// 不需要任何第三方库：SQLite / XML 解析 / TTS / SAF 全部是系统自带能力
dependencies {
}
