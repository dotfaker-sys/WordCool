name: 编译单词酷 APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release 标签（留空用 v1.2.0）'
        required: false
        default: 'v1.2.0'

permissions:
  contents: write

jobs:
  build:
    # 固定镜像版本，预装 Android SDK 路径稳定；不依赖第三方 setup-android action
    runs-on: ubuntu-22.04
    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      - name: 静态自检（XML / Kotlin / 资源 id / 音标数据）
        run: python3 tools/verify.py

      - name: 安装 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: 配置 Android SDK（用 runner 预装的 sdkmanager）
        shell: bash
        run: |
          set -e
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "SDK=$SDK"
          ls -d "$SDK"/cmdline-tools/*/bin 2>/dev/null || true
          SDKMGR=""
          for c in \
            "$SDK/cmdline-tools/latest/bin/sdkmanager" \
            "$SDK/cmdline-tools/bin/sdkmanager" \
            "$SDK/tools/bin/sdkmanager" \
            "$(command -v sdkmanager 2>/dev/null || true)"; do
            if [ -n "$c" ] && [ -x "$c" ]; then SDKMGR="$c"; break; fi
          done
          if [ -z "$SDKMGR" ]; then
            echo "找不到 sdkmanager，列出 SDK 目录："
            ls -R "$SDK" | head -60
            exit 1
          fi
          echo "sdkmanager=$SDKMGR"
          yes | "$SDKMGR" --licenses > /dev/null 2>&1 || true
          "$SDKMGR" "platforms;android-34" "build-tools;34.0.0" > /dev/null
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"

      - name: 准备 Gradle 8.2
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.2'

      - name: 编译 Debug APK
        shell: bash
        run: |
          gradle --version
          set -o pipefail
          gradle assembleDebug --no-daemon --stacktrace 2>&1 | tee build.log

      - name: 上传编译日志（无论成败）
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          if-no-files-found: warn

      - name: 失败时把编译日志回传到 ci-debug 分支便于排查
        if: failure()
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B ci-debug
          mkdir -p ci-debug
          tail -c 120000 build.log > ci-debug/build.log
          git add -f ci-debug/build.log
          git commit -m "ci: build log for diagnosis" || true
          git push -f origin ci-debug || true

      - name: 重命名 APK（ASCII 名，避免跨系统文件名编码问题）
        run: cp app/build/outputs/apk/debug/app-debug.apk WordCool.apk

      - name: 上传可安装 APK（Actions Artifact）
        uses: actions/upload-artifact@v4
        with:
          name: WordCool-APK
          path: WordCool.apk
          if-no-files-found: error

      - name: 发布 Release（附带可安装 APK）
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event.inputs.tag || 'v1.2.0' }}
        shell: bash
        run: |
          set -e
          cat > RELEASE_NOTES.md <<'EOF'
          ## 单词酷 v1.2.0

          一个**以离线为主、权限最小化**的 Android 背单词应用（唯一联网点是「检查更新」，零第三方依赖）。把你的 Word / Excel / PDF 词表导进来，按 Unit / Day 分组，一次学一个词，卡片自评 + 小测 + 间隔复习，直到记住。

          ### v1.2.0 新增：应用内检查更新

          「统计」页底部新增**版本与更新**：显示当前版本，点「检查更新」会读取一次 GitHub 公开 Release 版本号，发现新版就弹窗、点「去下载」用系统浏览器打开下载页。可打开「启动时自动检查」，之后每次启动静默查一次，**只有真有新版本才弹窗**。

          这是全应用**唯一**会联网的地方，也是唯一新增的权限（`INTERNET`）。只在用户点按钮或自己开开关时才发一次只读 GET；不上传词库、账号、设备信息，**不自动下载、不自动安装** APK。词库、导入、离线音标词典、双发音、复习、备份**全部仍离线可用**，没网也能正常背单词。不想要这个开关就别打开，检查失败也会给明确原因和手动打开下载页的退路。

          ### v1.1.0：从微信 / QQ 直接导入

          微信里点开词表 →「…」→「用其他应用打开」，或长按文件「分享」→ 选「单词酷」，文件直接进导入预览；不用先存到手机。同时支持多选文件合并成一批、把一段词表文字直接分享进来。QQ、企业微信、文件管理器同一套入口。**不读微信私有目录**，必须由你主动选择本应用，系统才把那一个文件的临时读取权交给它。导入页「⑦ 从微信 / QQ 导入」有详细步骤和排障。

          ### 这一版有什么

          - **导入**：`.docx`（段落与两列表格）、`.xlsx`、文字型 `.pdf`、`.txt` / `.csv`、粘贴文本、微信 / QQ 分享；`Unit 1` / `Day 2` / `第 3 单元` 标题行自动划组，导入后还能改名、按顺序重划、按组筛选
          - **音标**：随包内置离线开源音标词典 146,647 条（英 / 美两套）。Word 里只有「单词 + 汉语意思」也会自动补出 UK / US 音标；只补空字段、不覆盖手写内容，查不到的词留空，不会编造。查表不需要联网、不装别的 App、不要账号
          - **发音**：学习卡片并列「英音 UK」「美音 US」两个按钮各读各的，走手机系统 TTS 的本地离线语音包；缺包自动回退并提示，朗读失败给具体原因，语速三档，导入页可一键试听
          - **学习**：一次只显示一个单词，自评后自己点「下一个」才换词；每 3 张穿插一道 4 选 1 小测，连对 3 次升级「已掌握」，按 1 / 2 / 4 / 7 / 15 / 30 天复习
          - **数据**：词库、学习进度、打卡、组别全存手机本地；支持导出 / 恢复 JSON 备份

          ### 安装

          下载本页 Assets 里的 **WordCool.apk**，传到 Android 8.0+ 手机点安装（系统提示「未知来源」时允许本次安装即可）。Debug 包已签名，可直接使用。

          ### 如实说明的边界

          - **联网只用于检查更新**：新增 `INTERNET` 权限，仅在你点按钮 / 开了自动检查时读取公开版本号。这是相对 v1.0/v1.1「零权限」的变化；不想联网就不要开这个开关，其余功能不受影响
          - 音标数据是开源严式音素转写（含 `ɫ` `ɝ` `ɐ`），与课本宽式 IPA 写法略有差异，可在词条里手动改；词组、生造词、未收录词会留空
          - 发音是否响、是否真是英音 / 美音，取决于手机自带的语音包；**未做真机点按验证**
          - GitHub 未登录接口每小时限 60 次，遇到限流会明确提示并给出手动打开下载页的退路
          - 扫描图片版 PDF 没有文字层导不出；CID 字体的中文释义可能乱码，优先用 Word / Excel
          - 英音数据上游为 GPL-3.0，分发时请保留仓库内 `LICENSES/` 的声明与全文；美音数据为 MIT

          完整文档见仓库 `README.md` / `QUICKSTART.md` / `DESIGN.md`，编译与上传说明见 `UPLOAD.md`。
          EOF
          echo "TAG=$TAG"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release 已存在，覆盖上传 APK"
            gh release upload "$TAG" WordCool.apk --clobber
          else
            gh release create "$TAG" WordCool.apk \
              --title "单词酷 $TAG" \
              --notes-file RELEASE_NOTES.md
          fi
