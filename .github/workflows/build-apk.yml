name: 编译单词酷 APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      - name: 静态自检（XML / Kotlin / 资源 id / 音标数据）
        run: python3 tools/verify.py

      - name: 安装 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: 安装 Android SDK
        uses: android-actions/setup-android@v3

      - name: 接受 SDK 许可
        run: yes | sdkmanager --licenses > /dev/null || true

      - name: 安装 SDK 组件
        run: sdkmanager "platforms;android-34" "build-tools;34.0.0" > /dev/null

      - name: 准备 Gradle 8.2
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.2'

      - name: 生成 Gradle Wrapper（仓库不含 gradlew，CI 里现生成）
        run: gradle wrapper --gradle-version 8.2 --no-daemon

      - name: 编译 Debug APK
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: 重命名 APK（用 ASCII 名，避免跨系统文件名编码问题）
        run: cp app/build/outputs/apk/debug/app-debug.apk WordCool.apk

      - name: 上传可安装 APK
        uses: actions/upload-artifact@v4
        with:
          name: WordCool-APK
          path: WordCool.apk
          if-no-files-found: error
